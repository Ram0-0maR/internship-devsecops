[global]
daemonize = no

[www]
; Listen on a Unix socket instead of TCP port 9000
listen = /var/run/php-fpm/php-fpm.sock

; Socket permissions - Must be readable/writable by Caddy
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
