networks:
  dmz-net:
    external: true
  app-net:
    external: true
  db-net:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  server1-web_socket-volume:
    external: true
  server1b-web_socket-volume-2:
    external: true

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - dmz-net
      - app-net
      - db-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-net
      - dmz-net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - app-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres-db:5432/app_db?sslmode=disable"
    networks:
      - db-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis-cache:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      - db-net
      - app-net

  php-fpm-exporter-1:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: php-fpm-exporter-1
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "unix:///var/run/php-fpm/php-fpm.sock;/status"
    volumes:
      - server1-web_socket-volume:/var/run/php-fpm:ro
    networks:
      - app-net

  php-fpm-exporter-2:
    image: hipages/php-fpm_exporter:2.2.0
    container_name: php-fpm-exporter-2
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "unix:///var/run/php-fpm/php-fpm.sock;/status"
    volumes:
      - server1b-web_socket-volume-2:/var/run/php-fpm:ro
    networks:
      - app-net
