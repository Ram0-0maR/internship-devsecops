services:
  haproxy:
    image: haproxy:2.8-alpine
    container_name: ctf-haproxy-edge
    restart: unless-stopped
    # Explicitly instruct HAProxy to boot with the config file and in foreground master-worker mode
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      # Map our configuration file
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Map the combined SSL Certificate
      - ./certs/haproxy.pem:/usr/local/etc/haproxy/certs/haproxy.pem:ro
    networks:
      - ctf-dmz-net

networks:
  ctf-dmz-net:
    external: true
