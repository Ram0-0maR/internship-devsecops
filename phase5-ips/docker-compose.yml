networks:
  app-net:
    external: true

volumes:
  cassandra_data:

services:
  cassandra-ips:
    image: cassandra:4.1
    container_name: cassandra-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=IPS_Security_Cluster
      - CASSANDRA_NUM_TOKENS=128
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - app-net
